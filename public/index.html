<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diseño de Caja Corrugada</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <aside id="panel">
      <h1>📦 Caja Corrugada (RSC)</h1>
      <p class="hint">Dimensiones en milímetros (mm) o centímetros.</p>

      <label>
        Largo (L) - Eje X
        <input type="number" id="largo" value="40" min="10" max="200" step="1" />
      </label>

      <label>
        Ancho (A) - Eje Y
        <input type="number" id="ancho" value="30" min="10" max="200" step="1" />
      </label>

      <label>
        Alto (H) - Eje Z
        <input type="number" id="alto" value="20" min="10" max="200" step="1" />
      </label>

      <label>
        Pestaña / Ala (mm)
        <input type="number" id="ala" value="10" min="1" max="50" step="1" />
      </label>

      <div class="acciones">
        <button id="btn-descargar" class="btn-secundario">⬇️ Descargar Plano (SVG)</button>
      </div>
    </aside>

    <main id="contenedor-vistas">
      <!-- Vista 3D -->
      <div id="viewport-3d"></div>
      
      <!-- Vista 2D (Plano Desdoblado) -->
      <div id="viewport-2d">
        <h2>Plano de Corte (Desdoblado)</h2>
        <div id="svg-container"></div>
      </div>
    </main>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
